syntax = "proto3";

// Forge desktop binary IPC. Length-prefixed messages over Tauri channels.
// Wins 3-5x throughput at 16 panes vs. JSON-stringified streams.

package forge.ipc.v1;

message PtyFrame {
  string pane_id = 1;
  bytes  data    = 2;
  int64  ts_ms   = 3;
  uint32 seq     = 4;
}

message PtyExit {
  string pane_id  = 1;
  int32  code     = 2;
  int64  ts_ms    = 3;
}

enum BlockKind {
  BLOCK_UNSPECIFIED      = 0;
  BLOCK_PROMPT_START     = 1;
  BLOCK_PROMPT_END       = 2;
  BLOCK_COMMAND_START    = 3;
  BLOCK_COMMAND_FINISHED = 4;
}

message BlockEvent {
  string    pane_id   = 1;
  BlockKind kind      = 2;
  optional int32 exit_code = 3;
  int64     ts_ms     = 4;
}

message TaskUpdate {
  string task_id = 1;
  string status  = 2;
  string run_id  = 3;
}
