version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgres://forge:forge@postgres:5432/forge
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret
      MAILBOX_SECRET: ${MAILBOX_SECRET:-changeme-in-production}
      PORT: "4000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp:
    build:
      context: ..
      dockerfile: infra/mcp.Dockerfile
    environment:
      FORGE_API_URL: http://api:4000
      PORT: "4100"
    depends_on: [api]
    ports: ["4100:4100"]

  bench:
    build:
      context: ..
      dockerfile: apps/bench/runner/docker/sandbox.Dockerfile
    volumes:
      - ./migrations:/migrations:ro
    environment:
      - FORGE_API_URL=http://api:4000
    depends_on:
      api:
        condition: service_healthy
    profiles: [bench]

volumes:
  pgdata: {}
